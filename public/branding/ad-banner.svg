<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121317"/>
      <stop offset="60%" stop-color="#191A1F"/>
      <stop offset="100%" stop-color="#2a0f13"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3542"/>
      <stop offset="100%" stop-color="#E52532"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22232A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#15161A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#292A31" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="#292A31" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4 6"/>

  <!-- Glowing Accent Curves -->
  <circle cx="500" cy="80" r="120" fill="#E52532" opacity="0.12" filter="url(#glow)"/>
  <circle cx="100" cy="300" r="100" fill="#E52532" opacity="0.08" filter="url(#glow)"/>

  <!-- Gaming Controller Icon & Waves (Vector Graphic) -->
  <g transform="translate(420, 140)">
    <!-- Signal rings -->
    <circle cx="60" cy="50" r="70" fill="none" stroke="#E52532" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <circle cx="60" cy="50" r="50" fill="none" stroke="#FF3542" stroke-width="2" opacity="0.6"/>
    
    <!-- Gamepad Body -->
    <path d="M25 40 C 25 25, 45 20, 60 20 C 75 20, 95 25, 95 40 C 95 55, 90 75, 80 75 C 72 75, 68 62, 60 62 C 52 62, 48 75, 40 75 C 30 75, 25 55, 25 40 Z" fill="#18191E" stroke="#E52532" stroke-width="2.5"/>
    <!-- D-Pad -->
    <path d="M42 34 H36 V38 H42 V44 H46 V38 H52 V34 H46 V28 H42 Z" fill="#E52532"/>
    <!-- Action buttons -->
    <circle cx="78" cy="32" r="2.8" fill="#FF3542"/>
    <circle cx="72" cy="38" r="2.8" fill="#FF3542"/>
    <circle cx="84" cy="38" r="2.8" fill="#FF3542"/>
    <circle cx="78" cy="44" r="2.8" fill="#FF3542"/>
    <!-- Joysticks -->
    <circle cx="48" cy="50" r="5" fill="#292A31" stroke="#E52532" stroke-width="1.2"/>
    <circle cx="72" cy="50" r="5" fill="#292A31" stroke="#E52532" stroke-width="1.2"/>
  </g>

  <!-- Tag / Overline -->
  <g transform="translate(40, 50)">
    <rect width="160" height="28" rx="14" fill="rgba(229, 37, 50, 0.16)" stroke="rgba(229, 37, 50, 0.35)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#28C76F"/>
    <text x="28" y="18" fill="#FFD9DC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ESPAÇO DISPONÍVEL</text>
  </g>

  <!-- Main Headline -->
  <text x="40" y="125" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.8">ANUNCIE NO PING</text>

  <!-- Description -->
  <text x="40" y="165" fill="#B4B4BB" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Conecte sua marca ou live a milhares de</text>
  <text x="40" y="188" fill="#B4B4BB" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">gamers e streamers todos os dias.</text>

  <!-- Benefits Pills -->
  <g transform="translate(40, 215)">
    <rect width="130" height="26" rx="6" fill="#1C1D24" stroke="#292A31" stroke-width="1"/>
    <text x="12" y="17" fill="#F5F5F6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">✓ 100% Visível</text>

    <rect x="140" width="145" height="26" rx="6" fill="#1C1D24" stroke="#292A31" stroke-width="1"/>
    <text x="152" y="17" fill="#F5F5F6" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">✓ Anti-AdBlock Direto</text>
  </g>

  <!-- CTA Button Graphic -->
  <g transform="translate(40, 268)">
    <rect width="210" height="46" rx="10" fill="url(#redGrad)"/>
    <text x="25" y="28" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800">Anunciar Agora →</text>
  </g>

  <!-- Border -->
  <rect width="598" height="358" x="1" y="1" rx="15" fill="none" stroke="#292A31" stroke-width="1"/>
</svg>
